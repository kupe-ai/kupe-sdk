[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kupe"
version = "0.3.0"
description = "Official Python SDK for the Kupe voice API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Kupe" }]
keywords = ["kupe", "voice", "realtime", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
thinkspark = [
  # transformers >= 4.56 hard-requires torch >= 2.5; pin both together so a stale
  # torch in the environment fails at install time instead of at model load
  "torch>=2.5",
  "transformers>=4.49,<5",
  "numpy>=1.24",
  "huggingface_hub>=0.24",
]
mic = ["sounddevice>=0.4"]

[project.urls]
Homepage = "https://docs.kupe.in"
Documentation = "https://docs.kupe.in"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kupe = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
